<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM · Generador de Contenido</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@1,400;1,600&display=swap');

  :root {
    --negro: #1A1A1A;
    --blanco: #F5F1EA;
    --azul: #38B6FF;
    --gris: #888;
    --borde: #2e2e2e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--negro);
    color: var(--blanco);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 18px 32px 0;
    border-bottom: 1px solid var(--borde);
  }
  .tab {
    padding: 10px 20px;
    border: none;
    background: transparent;
    color: var(--gris);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all .2s;
    letter-spacing: .5px;
  }
  .tab.active, .tab:hover {
    color: var(--blanco);
    border-bottom-color: var(--azul);
  }

  /* ── LAYOUT ── */
  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    min-height: calc(100vh - 56px);
  }

  /* ── PANEL IZQ ── */
  .panel-left {
    padding: 24px 20px;
    border-right: 1px solid var(--borde);
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow-y: auto;
  }

  .section-title {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--azul);
    margin-bottom: 8px;
  }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 12px; color: var(--gris); letter-spacing: .5px; }

  select, textarea, input[type=text] {
    background: #111;
    border: 1px solid var(--borde);
    color: var(--blanco);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    border-radius: 6px;
    padding: 10px 12px;
    width: 100%;
    transition: border .2s;
    resize: vertical;
  }
  select:focus, textarea:focus, input:focus {
    outline: none;
    border-color: var(--azul);
  }

  .btn-gen {
    background: var(--azul);
    color: var(--negro);
    border: none;
    padding: 13px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: opacity .2s;
    width: 100%;
  }
  .btn-gen:hover { opacity: .85; }

  .btn-sec {
    background: transparent;
    color: var(--blanco);
    border: 1px solid var(--borde);
    padding: 10px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: border-color .2s;
    width: 100%;
  }
  .btn-sec:hover { border-color: var(--azul); color: var(--azul); }

  /* ── PANEL DER ── */
  .panel-right {
    padding: 28px 32px;
    overflow-y: auto;
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ── POST CARD ── */
  .post-preview-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .post-card {
    width: 420px;
    min-height: 420px;
    border-radius: 12px;
    padding: 36px 32px 28px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .post-card.dark {
    background: var(--negro);
    border: 1px solid var(--borde);
  }
  .post-card.light {
    background: var(--blanco);
    color: var(--negro);
  }

  .post-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--azul);
    margin-bottom: 14px;
  }

  .post-hook {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 16px;
  }

  .post-body {
    font-size: 14px;
    line-height: 1.75;
    color: #ccc;
    flex: 1;
  }
  .post-card.light .post-body { color: #444; }

  .post-kw {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--azul);
    margin-top: 18px;
  }
  .post-card.light .post-kw { color: #1A73C8; }

  /* ── FOOTER CON LOGO REAL ── */
  .post-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-top: 22px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .post-card.light .post-footer { border-top-color: rgba(0,0,0,0.08); }

  .logo-img {
    height: 38px;
    width: auto;
    object-fit: contain;
    opacity: 0.85;
  }
  .post-card.dark .logo-img {
    filter: invert(1) brightness(2);
  }
  .post-card.light .logo-img {
    filter: none;
  }

  .cta-block {
    background: var(--azul);
    color: var(--negro);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 16px;
    border-radius: 6px;
    display: inline-block;
    margin-top: 16px;
  }

  /* ── CARRUSEL ── */
  .carousel-nav {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .slide-counter {
    font-size: 13px;
    color: var(--gris);
  }
  .btn-nav {
    background: var(--borde);
    border: none;
    color: var(--blanco);
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    transition: background .2s;
  }
  .btn-nav:hover { background: var(--azul); color: var(--negro); }

  .slide { display: none; }
  .slide.active { display: flex; justify-content: center; }

  .slide-portada {
    background: var(--negro);
    border: 1px solid var(--azul);
  }
  .slide-portada .post-hook { font-size: 24px; }

  .slide-content {
    background: var(--blanco);
    color: var(--negro);
  }
  .slide-content .post-body { color: #333; }
  .slide-content .post-hook { color: var(--negro); }

  .slide-cierre {
    background: #111;
    border: 1px solid var(--borde);
  }

  /* ── DOTS ── */
  .dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 14px;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--borde);
    transition: background .2s;
    cursor: pointer;
  }
  .dot.active { background: var(--azul); }

  /* ── EXPORT ── */
  .export-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .btn-copy {
    background: transparent;
    color: var(--azul);
    border: 1px solid var(--azul);
    padding: 9px 20px;
    border-radius: 6px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: background .2s;
    letter-spacing: .5px;
  }
  .btn-copy:hover { background: var(--azul); color: var(--negro); }

  .copy-text-area {
    background: #0d0d0d;
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 16px;
    font-size: 13px;
    color: #ccc;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    margin-top: 16px;
    width: 100%;
    max-width: 600px;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 28px; right: 28px;
    background: var(--azul);
    color: var(--negro);
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .panel-left { border-right: none; border-bottom: 1px solid var(--borde); }
    .post-card { width: 100%; max-width: 420px; }
  }
</style>
</head>

<div class="tabs">
  <button class="tab active" onclick="switchTab('post', this)">📄 Post Único</button>
  <button class="tab" onclick="switchTab('carrusel', this)">🎠 Carrusel</button>
  <button class="tab" onclick="switchTab('copy', this)">✍️ Copy / Caption</button>
</div>

      </div>

          <option value="premium">Atraer clientes premium</option>

      </div>
    </div>

    <div>

          <option value="light">Blanco roto #F5F1EA</option>

      <div class="form-group" style="margin-top:12px">
        <label>Slides del carrusel</label>

          <option value="5" selected>5 slides</option>
          <option value="6">6 slides</option>
          <option value="7">7 slides</option>

    </div>

    <button class="btn-gen" onclick="generar()">⚡ GENERAR CONTENIDO</button>
    <button class="btn-sec" onclick="aleatorio()">🎲 Sorpréndeme</button>

  dolor: ['bocaaboca','regateo','visitas','tiempo','familia','margen'],
  deseo: ['estabilidad','premium','margen','familia'],
  autoridad: ['autoridad','instagram','bocaaboca'],
  reencuadre: ['bocaaboca','instagram','visitas','regateo'],
  conversion: ['bocaaboca','regateo','estabilidad']
};

let slidesData = [];
let slideActualIdx = 0;

function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-' + name).classList.add('active');
}

function getDatos() {
  const pilar = document.getElementById('pilar').value;
  const angulo = document.getElementById('angulo').value;
  const available = pilaresMap[pilar];
  const key = available.includes(angulo) ? angulo : available[0];
  return banco[pilar][key] || banco.dolor.bocaaboca;
}

function logoFooterHTML(estilo) {
  const filterStyle = estilo === 'dark' ? 'filter:invert(1) brightness(2);' : 'filter:none;';
  return `<img class="logo-img" style="height:38px;width:auto;object-fit:contain;opacity:0.85;${filterStyle}" src="${LOGO_SRC}" alt="RM">`;
}

function generar() {
  const datos = getDatos();
  const estilo = document.getElementById('estilo').value;
  const num = parseInt(document.getElementById('numSlides').value);

  // POST
  const card = document.getElementById('post-output');
  card.className = 'post-card ' + estilo;
  card.innerHTML = `
    <div>
      <div class="post-label">Strategic Media Buyer</div>
      <div class="post-hook">${datos.hook}</div>
      <div class="post-body">${datos.cuerpo.replace(/\n/g,'<br>')}</div>
      <div class="post-kw">${datos.keyword}</div>
    </div>
    <div class="post-footer" style="display:flex;justify-content:flex-end;align-items:center;margin-top:22px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08);">
      ${logoFooterHTML(estilo)}
    </div>`;

  const capBox = document.getElementById('caption-output');
  capBox.style.display = 'block';
  capBox.textContent = datos.caption + '\n\n' + datos.hashtags;

  buildCarrusel(datos, num, estilo);
  generarCopyBlocks(datos);
}

function buildCarrusel(datos, num, estilo) {
  const cuerpoLines = datos.cuerpo.split('\n').filter(l => l.trim());
  slidesData = [];

  slidesData.push({ tipo: 'portada', label: 'Strategic Media Buyer', hook: datos.hook, body: '', keyword: '' });

  const totalInter = num - 2;
  for (let i = 0; i < totalInter; i++) {
    const line = cuerpoLines[i] || cuerpoLines[cuerpoLines.length - 1];
    slidesData.push({ tipo: estilo === 'dark' ? 'content-dark' : 'content-light', label: 'Slide ' + (i + 2), hook: '', body: line, keyword: '' });
  }

  slidesData.push({ tipo: 'cierre', label: 'Sígueme para más', hook: datos.keyword, body: datos.caption, keyword: '@rosa.m.estrategia' });

  slideActualIdx = 0;
  document.getElementById('slideTotal').textContent = slidesData.length;
  renderSlides(estilo);
  renderDots();
}

function renderSlides(estilo) {
  const cont = document.getElementById('slides-container');
  cont.innerHTML = '';
  slidesData.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i === slideActualIdx ? ' active' : '');

    let bgClass = 'dark';
    if (s.tipo === 'portada') bgClass = 'slide-portada';
    else if (s.tipo === 'content-light') bgClass = 'slide-content';
    else if (s.tipo === 'cierre') bgClass = 'slide-cierre';

    const slideEstilo = (s.tipo === 'content-light') ? 'light' : 'dark';

    div.innerHTML = `
      <div class="post-card ${bgClass}">
        <div>
          <div class="post-label">${s.label}</div>
          ${s.hook ? '<div class="post-hook">' + s.hook + '</div>' : ''}
          ${s.body ? '<div class="post-body">' + s.body + '</div>' : ''}
          ${s.keyword && s.tipo !== 'cierre' ? '<div class="post-kw">' + s.keyword + '</div>' : ''}
          ${s.tipo === 'cierre' ? '<div class="cta-block">Escríbeme</div>' : ''}
        </div>
        <div style="display:flex;justify-content:flex-end;align-items:center;margin-top:22px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.1);">
          ${logoFooterHTML(slideEstilo)}
        </div>
      </div>`;
    cont.appendChild(div);
  });
  document.getElementById('slideActual').textContent = slideActualIdx + 1;
}

function renderDots() {
  const dc = document.getElementById('dots-container');
  dc.innerHTML = '';
  slidesData.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === slideActualIdx ? ' active' : '');
    d.onclick = () => goSlide(i);
    dc.appendChild(d);
  });
}

function goSlide(idx) {
  slideActualIdx = idx;
  document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === idx));
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
  document.getElementById('slideActual').textContent = idx + 1;
}

function prevSlide() { if (slideActualIdx > 0) goSlide(slideActualIdx - 1); }
function nextSlide() { if (slideActualIdx < slidesData.length - 1) goSlide(slideActualIdx + 1); }

function generarCopyBlocks(datos) {
  const pilar = document.getElementById('pilar').value;
  const pilarTextos = { dolor:'Dolor', deseo:'Deseo', autoridad:'Autoridad', reencuadre:'Reencuadre', conversion:'Conversión' };
  const blocks = document.getElementById('copy-blocks');
  blocks.innerHTML = `
    <div style="margin-bottom:28px">
      <div class="section-title">Pilar — ${pilarTextos[pilar] || ''}</div>
      <p style="font-size:11px;color:var(--gris);letter-spacing:1px;margin:12px 0 4px">HOOK</p>
      <div class="copy-text-area" style="max-width:100%;margin-top:4px">${datos.hook}</div>
      <p style="font-size:11px;color:var(--gris);letter-spacing:1px;margin:16px 0 4px">CUERPO</p>
      <div class="copy-text-area" style="max-width:100%;margin-top:4px">${datos.cuerpo}</div>
      <p style="font-size:11px;color:var(--gris);letter-spacing:1px;margin:16px 0 4px">FRASE EDITORIAL</p>
      <div class="copy-text-area" style="max-width:100%;margin-top:4px">${datos.keyword}</div>
      <p style="font-size:11px;color:var(--gris);letter-spacing:1px;margin:16px 0 4px">CAPTION + HASHTAGS</p>
      <div class="copy-text-area" style="max-width:100%;margin-top:4px">${datos.caption}\n\n${datos.hashtags}</div>
      <div class="export-row" style="margin-top:16px">
        <button class="btn-copy" onclick="copiarTexto(datos_cache.hook)">📋 Hook</button>
        <button class="btn-copy" onclick="copiarTexto(datos_cache.cuerpo)">📋 Cuerpo</button>
        <button class="btn-copy" onclick="copiarTexto(datos_cache.caption + '\n\n' + datos_cache.hashtags)">📋 Caption</button>
      </div>
    </div>`;
  window.datos_cache = datos;
}

function copiarTexto(txt) {
  navigator.clipboard.writeText(txt).then(() => toast());
}

function copiarPost() {
  const d = getDatos();
  navigator.clipboard.writeText(d.hook + '\n\n' + d.cuerpo + '\n\n' + d.keyword).then(() => toast());
}

function copiarCaption() {
  const d = getDatos();
  navigator.clipboard.writeText(d.caption + '\n\n' + d.hashtags).then(() => toast());
}

function copiarCarrusel() {
  const txt = slidesData.map((s, i) => `SLIDE ${i+1}\n${s.hook}\n${s.body}\n${s.keyword}`).join('\n\n---\n\n');
  navigator.clipboard.writeText(txt).then(() => toast());
}

function copiarSlide() {
  const s = slidesData[slideActualIdx];
  if (!s) return;
  navigator.clipboard.writeText([s.hook,s.body,s.keyword].filter(Boolean).join('\n\n')).then(() => toast());
}

function toast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function aleatorio() {
  const pilares = Object.keys(pilaresMap);
  const pilar = pilares[Math.floor(Math.random() * pilares.length)];
  const angulos = pilaresMap[pilar];
  const angulo = angulos[Math.floor(Math.random() * angulos.length)];
  document.getElementById('pilar').value = pilar;
  document.getElementById('angulo').value = angulo;
  document.getElementById('estilo').value = Math.random() > 0.5 ? 'dark' : 'light';
  generar();
}

window.onload = () => generar();
</script>
</body>
</html>
