<style>

.thumb{cursor:pointer;border:2px solid transparent;border-radius:4px;overflow:hidden;position:relative}.thumb.active{border-color:var(--blue)}.thumb .inner{position:relative;aspect-ratio:4/5;width:100%}.thumb .host{position:absolute;top:0;left:0;width:1080px;height:1350px;transform-origin:top left;pointer-events:none}.thumb .n{position:absolute;bottom:3px;right:4px;background:rgba(0,0,0,.75);color:rgba(255,255,255,.6);font-size:8px;padding:1px 4px;border-radius:2px}.thumb .k{position:absolute;top:3px;left:4px;background:rgba(14,14,14,.85);color:rgba(255,255,255,.4);font-size:7px;letter-spacing:.06em;text-transform:uppercase;padding:2px 4px;border-radius:2px}

.slide{width:1080px;height:1350px;position:relative;overflow:hidden;display:flex;flex-direction:column;font-family:var(--san)}.SD{background:var(--dark)}.SL{background:var(--light)}.SB{background:var(--blue)}
.SD .t,.SD .m,.SD .b{color:var(--light)}.SL .t,.SL .m,.SL .b{color:var(--dark)}.SB .t,.SB .m,.SB .b{color:var(--dark)}.SD .a,.SL .a{color:var(--blue)}.SB .a{color:var(--dark)}.SD .l,.SL .l{background:rgba(255,255,255,.09)}.SB .l{background:rgba(26,26,26,.14)}

.zoneH{flex:1;display:flex;flex-direction:column;justify-content:center;gap:34px;padding-top:40px}.zoneQ{flex:1;display:flex;flex-direction:column;justify-content:center;gap:36px}.qm{font-family:var(--ser);font-size:130px;line-height:.65;opacity:.18;margin-bottom:-16px}.zoneL{flex:1;display:flex;flex-direction:column;margin-top:28px}.lrow{display:flex;align-items:flex-start;gap:20px;padding:22px 0;border-top:1px solid rgba(26,26,26,.1)}.lrow:last-child{border-bottom:1px solid rgba(26,26,26,.1)}.SD .lrow,.SD .lrow:last-child{border-color:rgba(255,255,255,.08)}.ln{font-family:var(--ser);font-style:italic;font-size:36px;line-height:1;color:var(--blue);min-width:36px;padding-top:2px}.sg{display:grid;grid-template-columns:1fr 1fr;flex:1;margin-top:26px}.sc{padding:40px 36px;display:flex;flex-direction:column;gap:8px}.sc:nth-child(1),.sc:nth-child(2){border-bottom:1px solid rgba(26,26,26,.1)}.sc:nth-child(1),.sc:nth-child(3){border-right:1px solid rgba(26,26,26,.1)}.SD .sc{border-color:rgba(255,255,255,.08)!important}.sn{font-family:var(--ser);font-size:88px;line-height:1;color:var(--blue)}.sl{font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:rgba(26,26,26,.4);font-weight:500}.SD .sl{color:rgba(255,255,255,.35)}
.stepsR{display:flex;align-items:flex-start;flex:1;margin-top:34px}.pst{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:0 12px;position:relative}.pst:not(:last-child)::after{content:'';position:absolute;top:25px;left:calc(50% + 25px);width:calc(100% - 50px);height:2px;background:rgba(56,182,255,.2)}.pn{width:50px;height:50px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;flex-shrink:0;z-index:1}
.svZ{flex:1;display:flex;flex-direction:column;margin-top:34px}.svr{display:flex;align-items:center;gap:18px;padding:22px 0;border-bottom:1px solid rgba(26,26,26,.1)}.svr:first-child{border-top:1px solid rgba(26,26,26,.1)}.SD .svr{border-color:rgba(255,255,255,.08)}.svC{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--blue);display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:13px;flex-shrink:0}
.dq{flex:1;display:flex;align-items:center;padding:20px 0}.dop{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}.di{border-radius:4px;padding:28px 20px;font-size:22px;line-height:1.4;font-weight:300;text-align:center}.da{background:rgba(56,182,255,.12);border:1px solid rgba(56,182,255,.3);color:var(--blue)}.db{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4)}.SL .db{background:rgba(26,26,26,.05);border-color:rgba(26,26,26,.12);color:rgba(26,26,26,.4)}
.ctaP{display:inline-flex;align-items:center;gap:10px;background:var(--blue);color:#fff;font-weight:600;letter-spacing:.06em;padding:18px 32px;border-radius:3px;align-self:flex-start}.SB .ctaP{background:var(--dark);color:var(--light)}
.ba{display:grid!important;grid-template-rows:1fr 1fr}.bh{padding:60px 90px 50px;display:flex;flex-direction:column;gap:12px;position:relative}.bef{background:#111}.aft{background:var(--dark)}.bd{display:inline-flex;align-items:center;gap:8px;font-size:15px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}.dot{width:7px;height:7px;border-radius:50%}.bef .dot{background:rgba(255,255,255,.18)}.bef .bd{color:rgba(255,255,255,.28)}.aft .dot{background:var(--blue)}.aft .bd{color:var(--blue)}.bt{font-family:var(--ser);font-size:52px;line-height:1.2}.bef .bt{color:rgba(255,255,255,.25);font-style:italic}.aft .bt{color:var(--light)}.bf{display:flex;justify-content:space-between;align-items:center;margin-top:auto}.bdv{position:absolute;bottom:0;left:90px;right:90px;height:1px;background:rgba(255,255,255,.07)}
</style>

<div id="genO"><div class="ring"></div><div id="gText">Generando...</div><div class="steps" id="gSteps"></div></div>
<div id="expO"><div id="eText">Exportando...</div><div class="barw"><div class="bar" id="eBar"></div></div></div>
<div id="top"><div id="brand"><div class="rm">RM</div><div><h1>Rosa María Studio</h1><p>items + tipografía</p></div></div><div id="actions"><button class="btn on" id="mPost" onclick="setMode('post')">Post</button><button class="btn" id="mCarr" onclick="setMode('carrusel')">Carrusel</button><button class="btn" onclick="toggleGuides()">Guías</button><button class="btn" onclick="exportCurrent()">Exportar JPG</button><button class="btn" onclick="exportAll()">Exportar ZIP</button><button class="btn primary" id="genBtn" onclick="generate()">✦ <span id="genTxt">Generar</span></button></div></div>

<div class="sec"><h2>Ángulo del contenido</h2><div class="row"><label>Tema</label><select id="angle"><option value="auto">Automático aleatorio</option><option value="bocaboca">Dependencia del boca a boca</option><option value="buscaprecios">Clientes que regatean</option><option value="saturacion">Saturación y tiempo perdido</option><option value="autoridad">Autoridad digital y percepción</option><option value="sistema">Sistema de captación predecible</option><option value="tiempo">Recuperar tiempo y familia</option><option value="premium">Atraer clientes premium</option><option value="objecion">Objeciones al marketing</option><option value="precio">Dejar de competir por precio</option><option value="estabilidad">Estabilidad e ingresos predecibles</option></select></div><div class="row"><label>Slides</label><select id="numSlides"><option value="5">5 slides</option><option value="6">6 slides</option><option value="7" selected>7 slides</option></select></div></div>
<div class="sec"><h2>Slide activo</h2><div class="row"><label>Tipo</label><select id="type" onchange="editSlide('tipo',this.value)"><option value="hook">Hook</option><option value="frase">Frase</option><option value="ba">Before / After</option><option value="lista">Lista</option><option value="stats">Stats</option><option value="proceso">Proceso</option><option value="servicio">Servicio</option><option value="debate">Debate</option><option value="cta">CTA</option><option value="post">Post</option></select></div><div class="row"><label>Fondo</label><select id="bg" onchange="editSlide('fondo',this.value)"><option value="dark">Negro carbón</option><option value="light">Blanco roto</option><option value="blue">Azul marca</option></select></div><div class="row"><label>Eyebrow (opcional)</label><input id="eye" type="text" placeholder="Opcional" oninput="editSlide('eye',this.value)"></div><div class="row"><label>Headline</label><textarea id="head" rows="3" oninput="editSlide('head',this.value)"></textarea></div><div class="row"><label>Cuerpo</label><textarea id="body" rows="2" oninput="editSlide('body',this.value)"></textarea></div><div class="row"><label>Items</label><div class="range"><input id="itemCount" type="range" min="1" max="6" value="4" oninput="setItemCount(parseInt(this.value))"><span class="val" id="vItemsCount">4</span></div></div><div class="row"><label>Tamaño item</label><div class="range"><input id="rItemText" type="range" min="14" max="42" value="27" oninput="applyType()"><span class="val" id="vItemText">27px</span></div></div><div class="item-grid" id="itemInputs"></div><div class="row"><label>CTA</label><input id="cta" type="text" oninput="editSlide('cta',this.value)"></div></div>
<div class="sec"><h2 style="display:flex;justify-content:space-between;align-items:center">Tipografía <button class="btn" style="padding:3px 8px;font-size:8px" onclick="resetType()">Reset</button></h2><div class="row"><label>Eyebrow</label><div class="range"><input id="rEye" type="range" min="8" max="24" value="20" oninput="applyType()"><span class="val" id="vEye">20px</span></div></div><div class="row"><label>Headline</label><div class="range"><input id="rHead" type="range" min="40" max="130" value="96" oninput="applyType()"><span class="val" id="vHead">96px</span></div></div><div class="row"><label>Cuerpo</label><div class="range"><input id="rBody" type="range" min="16" max="48" value="31" oninput="applyType()"><span class="val" id="vBody">31px</span></div></div><div class="row"><label>Items</label><div class="range"><input id="rItems" type="range" min="14" max="42" value="27" oninput="applyType()"><span class="val" id="vItems">27px</span></div></div><div class="row"><label>CTA</label><div class="range"><input id="rCta" type="range" min="10" max="32" value="18" oninput="applyType()"><span class="val" id="vCta">18px</span></div></div></div>
</div></div>
<script>
const B={angulos:{bocaboca:'dependencia del boca a boca',buscaprecios:'clientes que solo piden precio',saturacion:'saturación y tiempo perdido',autoridad:'autoridad digital y percepción',sistema:'sistema de captación predecible',tiempo:'recuperar tiempo y familia',premium:'atraer clientes premium',objecion:'objeciones al marketing',precio:'dejar de competir por precio',estabilidad:'estabilidad e ingresos predecibles'},hooks:{bocaboca:['Llevas 15 años haciendo reformas perfectas.\n¿Y el mes que viene no sabes si tendrás obras?','El boca a boca no es una estrategia.\nEs rezar para que alguien te recuerde antes de que acabe el mes.'],buscaprecios:['3 visitas esta semana.\n3 presupuestos enviados.\n0 obras cerradas.\nEl problema no está en tu precio.','Cada visita a alguien que solo busca el precio más bajo te roba algo que no vuelve: tu tarde.'],saturacion:['Mañana: obra, proveedor, visita comercial, presupuestos.\nAsí no se crece. Así se sobrevive.','El mayor problema de tu empresa no es la competencia.\nEres tú, intentando hacerlo todo.'],autoridad:['Hay empresas de reformas peores cerrando obras mejores.\nNo es casualidad. Es percepción.','Tu calidad técnica es impecable.\nEl problema es que nadie lo sabe antes de verte.'],sistema:['12 leads cualificados en 7 días.\nCon precio acordado antes de la visita.','Hay una diferencia entre recibir contactos y tener un sistema que filtra y llena tu agenda.'],tiempo:['El verdadero lujo no es un coche mejor.\nEs poder apagar el móvil a las 19:00.','Construiste una empresa para vivir mejor.\nNo para vivir estresado.'],premium:['No necesitas más clientes.\nNecesitas mejores clientes.','Hay un tipo de cliente que no regatea, respeta los plazos y te recomienda después.'],objecion:['"Ya probé publicidad y no funcionó."\nEs la frase que más escucho de los que luego tienen mejores resultados.','"Instagram no funciona para reformas."\nSin estrategia no funciona.\nCon estrategia, es otra historia.'],precio:['Competir por precio es lo que ocurre cuando no transmites suficiente autoridad.','Tu calidad técnica sin autoridad visual deja dinero encima de la mesa.'],estabilidad:['Un trimestre cubierto. Agenda planificada.\nUn negocio que no depende de la suerte.\nEso también se construye.','La inestabilidad de clientes no es solo un problema financiero.\nEs ansiedad silenciosa todos los meses.'],default:['Estrategia que convierte.\nResultados que se notan.']},frases:['El boca a boca no es una estrategia.\nEs una oración.','No necesitas más seguidores.\nNecesitas mejores clientes.','El precio no es el problema.\nEl posicionamiento sí.','Menos curiosos. Más obras rentables.'],listas:{default:['Estabilidad: saber que el mes siguiente está cubierto antes de que acabe este.','Autoridad: que el tipo de cliente que te contacta ya sepa que puedes cobrar lo que vales.','Tiempo: dejar de regalar tardes a presupuestos que nunca se cierran.','Control: tener un sistema que funciona sin que todo dependa de ti.']},stats:[['127%','Aumento de solicitudes'],['−32%','Coste por conversión'],['3.6×','ROI medio de campaña'],['89%','Empresas que escalan']],debates:[['¿Las reformas se venden\npor precio o por confianza?','Por confianza.\nEl precio es excusa\ncuando no ven el valor.','Por precio.\nEl mercado de reformas\nes muy competitivo.']],antes:[['2 presupuestos al mes. Todo por recomendación. Sin control ni previsibilidad.','12 leads cualificados por semana. Agenda cubierta 3 semanas por adelantado.']],ctas:['Escríbeme CLIENTES para empezar hoy','Escríbeme SISTEMA','Escríbeme RESULTADOS'],subtitulos:['Esto cambió todo lo que hacía en Meta y Google.','Lo que nadie del sector te dice en público.']};
let S=[],cur=0,mode='carrusel',guides=false,t={eye:20,head:96,body:31,items:27,itemText:27,cta:18};const HANDLE='@rosamariamedia';
const rnd=a=>a[Math.floor(Math.random()*a.length)];const ps=s=>s?String(s).replace(/\n/g,'<br>'):'';const cls=f=>f==='light'?'SL':f==='blue'?'SB':'SD';const wait=ms=>new Promise(r=>setTimeout(r,ms));
function eyeBlock(d){return d.eye?`<div class="ab"></div><span class="m" style="font-size:${t.eye}px;font-weight:500;letter-spacing:.18em;text-transform:uppercase">${d.eye}</span>`:''}
function makeSlide(d,i){const n=String(i+1).padStart(2,'0'),c=cls(d.fondo||'dark');if(d.tipo==='ba')return `<div class="slide ${c} SP ba"><div class="bh bef"><div class="bd"><span class="dot"></span>Antes</div><p class="bt">${ps((d.items||[])[0]||'')}</p><div class="bf"><span style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.2)">${HANDLE}</span><span style="font-size:14px;color:rgba(255,255,255,.2)">${n}</span></div><div class="bdv"></div></div><div class="bh aft"><div class="bd"><span class="dot"></span>Después</div><p class="bt">${ps((d.items||[])[1]||'')}</p><div class="bf"><span class="RM" style="color:rgba(255,255,255,.22)">RM</span><span style="font-size:16px;color:var(--blue);letter-spacing:.1em;text-transform:uppercase">${d.cta||'Escríbeme RESULTADOS'}</span></div></div></div>`;if(d.tipo==='frase')return `<div class="slide ${c} SP"><div class="SH"><div style="display:flex;align-items:center;gap:12px">${eyeBlock(d)}</div><div class="RM">RM</div></div><div class="zoneQ"><div class="qm m">"</div><h1 class="t" style="font-family:var(--ser);font-size:${t.head}px;line-height:1.08;font-weight:400">${ps(d.head||'')}</h1><p class="b" style="font-size:${t.body}px;line-height:1.6;font-weight:300">${ps(d.body||'')}</p></div><div class="SF"><span class="m" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${HANDLE}</span><span class="t" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${d.cta||''}</span></div></div>`;if(d.tipo==='lista')return `<div class="slide ${c} SP"><div class="SH"><div style="display:flex;align-items:center;gap:12px">${eyeBlock(d)}</div><div class="RM">RM</div></div><h1 class="t" style="font-family:var(--ser);font-size:${t.head}px;line-height:1.1;font-weight:400;margin-top:22px">${ps(d.head||'')}</h1><div class="zoneL">${(d.items||[]).map((x,ii)=>`<div class="lrow"><div class="ln">${String(ii+1).padStart(2,'0')}</div><div class="t" style="font-size:${t.itemText}px;line-height:1.45;font-weight:300">${ps(x)}</div></div>`).join('')}</div><div class="SF"><span class="m" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${HANDLE}</span><span class="a" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${d.cta||''}</span></div></div>`;if(d.tipo==='stats')return `<div class="slide ${c} SP"><div class="SH"><div style="display:flex;align-items:center;gap:12px">${eyeBlock(d)}</div><div class="RM">RM</div></div><h1 class="t" style="font-family:var(--ser);font-size:${t.head}px;line-height:1.1;font-weight:400;margin-top:22px">${ps(d.head||'')}</h1><div class="sg">${(d.items||[]).slice(0,4).map(x=>{const p=x.indexOf(' ');return `<div class="sc"><div class="sn">${p>-1?x.slice(0,p):x}</div><div class="sl">${p>-1?x.slice(p+1):''}</div></div>`}).join('')}</div><div class="SF"><span class="m" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${HANDLE}</span><span class="m" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${n} / ${S.length}</span></div></div>`;if(d.tipo==='debate')return `<div class="slide ${c} SP"><div class="SH"><div style="display:flex;align-items:center;gap:12px">${eyeBlock(d)}</div><div class="RM">RM</div></div><div class="dq"><h1 class="t" style="font-family:var(--ser);font-size:${t.head}px;line-height:1.1;font-weight:400">${ps(d.head||'')}</h1></div><div class="dop"><div class="di da" style="font-size:${t.itemText}px">${ps((d.items||[])[0]||'')}</div><div class="di db" style="font-size:${t.itemText}px">${ps((d.items||[])[1]||'')}</div></div><div class="SF"><span class="m" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${HANDLE}</span><span class="m" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${d.cta||''}</span></div></div>`;if(d.tipo==='cta')return `<div class="slide ${c} SP"><div class="SH"><div style="display:flex;align-items:center;gap:12px">${eyeBlock(d)}</div><div class="RM">RM</div></div><div class="zoneH"><div class="l"></div><h1 class="t" style="font-family:var(--ser);font-size:${t.head}px;line-height:1.08;font-weight:400">${ps(d.head||'¿Listo para\ncambiar cómo\ncaptas clientes?')}</h1><div class="l"></div><p class="b" style="font-size:${t.body}px;line-height:1.6;font-weight:300">${ps(d.body||'')}</p><div class="ctaP"><span>✦</span><span style="font-size:${t.cta}px">${d.cta||'Escríbeme CLIENTES para empezar hoy'}</span></div></div><div class="SF"><span class="m" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${HANDLE}</span><span class="RM" style="opacity:.22">RM</span></div></div>`;if(d.tipo==='post')return `<div class="slide ${c} SP"><div class="SH"><div style="display:flex;align-items:center;gap:12px">${eyeBlock(d)}</div><div class="RM">RM</div></div><div class="zoneH"><div class="l"></div><h1 class="t" style="font-family:var(--ser);font-size:${t.head}px;line-height:1.08;font-weight:400">${ps(d.head||'')}</h1><div class="l"></div><p class="b" style="font-size:${t.body}px;line-height:1.6;font-weight:300">${ps(d.body||'')}</p><div class="ctaP"><span>✦</span><span style="font-size:${t.cta}px">${d.cta||''}</span></div></div><div class="SF"><span class="m" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${HANDLE}</span><span class="RM" style="opacity:.22">RM</span></div></div>`;if(d.tipo==='servicio')return `<div class="slide ${c} SP"><div class="SH"><div style="display:flex;align-items:center;gap:12px">${eyeBlock(d)}</div><div class="RM">RM</div></div>${d.head?`<h1 class="t" style="font-family:var(--ser);font-size:${t.head}px;line-height:1.1;font-weight:400;margin-top:22px">${ps(d.head)}</h1>`:''}<div class="svZ">${(d.items||[]).map(x=>`<div class="svr"><div class="svC">✓</div><div class="t" style="font-size:${t.itemText}px;line-height:1.3;font-weight:300">${ps(x)}</div></div>`).join('')}</div><div class="SF"><span class="m" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${HANDLE}</span><span class="a" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${d.cta||''}</span></div></div>`;if(d.tipo==='proceso')return `<div class="slide ${c} SP"><div class="SH"><div style="display:flex;align-items:center;gap:12px">${eyeBlock(d)}</div><div class="RM">RM</div></div><h1 class="t" style="font-family:var(--ser);font-size:${t.head}px;line-height:1.1;font-weight:400;margin-top:22px">${ps(d.head||'')}</h1><div class="stepsR">${(d.items||[]).map((x,i)=>{const p=x.indexOf(':');return `<div class="pst"><div class="pn">${i+1}</div><div class="t" style="font-family:var(--ser);font-size:32px;font-style:italic;line-height:1.15">${ps(p>-1?x.slice(0,p):x)}</div><div class="b" style="font-size:20px;line-height:1.45;font-weight:300">${ps(p>-1?x.slice(p+1):'')}</div></div>`}).join('')}</div><div class="SF"><span class="m" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${HANDLE}</span><span class="a" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${d.cta||''}</span></div></div>`;return `<div class="slide ${c} SP"><div class="SH"><div style="display:flex;align-items:center;gap:12px">${eyeBlock(d)}</div><div class="RM">RM</div></div><div class="zoneH"><div class="l"></div><h1 class="t" style="font-family:var(--ser);font-size:${t.head}px;line-height:1.08;font-weight:400">${ps(d.head||'')}</h1><div class="l"></div></div><div class="SF"><span class="m" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${HANDLE}</span><span class="a" style="font-size:${t.cta}px;letter-spacing:.15em;text-transform:uppercase;font-weight:500">${d.cta||''}</span></div></div>`}
function buildCarrusel(a){const hooks=B.hooks[a]||B.hooks.default,listas=B.listas.default,deb=B.debates[0],ba=B.antes[0],fr=rnd(B.frases),cta=rnd(B.ctas),stats=[...B.stats].sort(()=>Math.random()-.5);return[{tipo:'hook',fondo:'dark',eye:'',head:rnd(hooks),body:rnd(B.subtitulos),cta:''},{tipo:'frase',fondo:'light',eye:'',head:fr,body:'',cta:HANDLE},{tipo:'ba',fondo:'dark',items:ba,cta:cta},{tipo:'lista',fondo:'dark',eye:'',head:B.angulos[a]||'Lo que cambia cuando tienes un sistema.',items:listas.default,cta:cta},{tipo:'stats',fondo:'light',eye:'',head:'En números reales.',items:stats.slice(0,4).map(x=>x[0]+' '+x[1]),cta:''},{tipo:'debate',fondo:'dark',eye:'',head:deb[0],items:[deb[1],deb[2]],cta:HANDLE},{tipo:'cta',fondo:'dark',eye:'',head:'¿Listo para\ncambiar cómo\ncaptas clientes?',body:'Escríbeme y hablamos sin compromiso.\nTe cuento exactamente cómo funciona.',cta:cta}]}
function buildPost(a){const hooks=B.hooks[a]||B.hooks.default;return[{tipo:'post',fondo:Math.random()>.5?'dark':'light',eye:'',head:rnd(hooks),body:rnd(B.subtitulos),cta:rnd(B.ctas)}]}
async function generate(){const btn=document.getElementById('genBtn'),o=document.getElementById('genO'),txt=document.getElementById('gText'),steps=document.getElementById('gSteps');btn.classList.add('loading');document.getElementById('genTxt').textContent='Generando...';o.classList.add('on');steps.innerHTML=['Analizando ángulo...','Construyendo copy...','Aplicando diseño...','¡Listo!'].map(x=>`<div class="step">${x}</div>`).join('');const s=steps.querySelectorAll('.step');let a=document.getElementById('angle').value;if(a==='auto')a=rnd(Object.keys(B.angulos));try{s[0].classList.add('ok');txt.textContent='Ángulo: '+a;await wait(160);s[1].classList.add('ok');await wait(160);S.length=0;const base=(mode==='post'?buildPost(a):buildCarrusel(a));if(mode==='post')S.push(base[0]);else{const n=parseInt(document.getElementById('numSlides').value||'7');S.push(...base.slice(0,n));}s[2].classList.add('ok');await wait(160);s[3].classList.add('ok');await wait(160);cur=0;buildThumbs();show(0);scale()}catch(err){console.error(err);alert('Generación falló.')}o.classList.remove('on');btn.classList.remove('loading');document.getElementById('genTxt').textContent='Generar'}
function applyType(){t.eye=parseInt(rEye.value);t.head=parseInt(rHead.value);t.body=parseInt(rBody.value);t.items=parseInt(rItems.value);t.itemText=parseInt(rItemText.value);t.cta=parseInt(rCta.value);vEye.textContent=t.eye+'px';vHead.textContent=t.head+'px';vBody.textContent=t.body+'px';vItems.textContent=t.items+'px';vItemText.textContent=t.itemText+'px';vCta.textContent=t.cta+'px';if(S.length){buildThumbs();show(cur)}}function resetType(){rEye.value=20;rHead.value=96;rBody.value=31;rItems.value=27;rItemText.value=27;rCta.value=18;applyType()}
function editSlide(k,v){if(!S[cur])return;S[cur][k]=v;buildThumbs();show(cur)}function editItem(i,v){if(!S[cur])return;S[cur].items=S[cur].items||[];S[cur].items[i]=v;buildThumbs();show(cur)}function syncPanel(i){const d=S[i];if(!d)return;type.value=d.tipo||'hook';bg.value=d.fondo||'dark';eye.value=d.eye||'';head.value=d.head||'';body.value=d.body||'';cta.value=d.cta||'';const arr=(d.items||[]).slice(0,6);document.getElementById('itemCount').value=arr.length||4;document.getElementById('vItemsCount').textContent=arr.length||4;const wrap=document.getElementById('itemInputs');wrap.innerHTML='';for(let j=0;j<6;j++){const card=document.createElement('div');card.className='item-card';card.style.display=j<(arr.length||4)?'flex':'none';card.innerHTML=`<div class="meta"><span>Item ${j+1}</span><span>Texto</span></div><input type="text" value="${(arr[j]||'').replace(/"/g,'&quot;')}" oninput="editItem(${j},this.value)">`;wrap.appendChild(card)}}
function setItemCount(n){document.getElementById('vItemsCount').textContent=n;if(S[cur]){S[cur].items=(S[cur].items||[]).slice(0,n);while(S[cur].items.length<n)S[cur].items.push('');buildThumbs();show(cur)}syncPanel(cur)}
function show(i){cur=i;const d=S[i];stageInner.innerHTML=d?makeSlide(d,i):`<div class="slide SD SP"><div style="display:flex;align-items:center;justify-content:center;flex:1"><p style="font-size:34px;color:rgba(255,255,255,.2);text-align:center">Pulsa Generar<br>para comenzar</p></div></div>`;count.textContent=S.length?(i+1)+' / '+S.length:'— / —';prevBtn.disabled=i<=0||!S.length;nextBtn.disabled=i>=S.length-1||!S.length;if(d)syncPanel(i);document.querySelectorAll('.thumb').forEach((t,ti)=>t.classList.toggle('active',ti===i))}
function nav(d){const n=cur+d;if(n>=0&&n<S.length)show(n)}function scale(){const vp=document.getElementById('viewport'),inner=document.getElementById('stageInner'),sw=vp.offsetWidth,sc=sw/1080;inner.style.transform='scale('+sc+')';stage.style.height=(1350*sc)+'px'}
function buildThumbs(){const left=document.getElementById('left'),title=left.querySelector('.title');left.innerHTML='';left.appendChild(title);const tw=left.offsetWidth-12,sc=tw/1080;S.forEach((d,i)=>{const w=document.createElement('div');w.className='thumb'+(i===cur?' active':'');w.onclick=()=>show(i);const inr=document.createElement('div');inr.className='inner';inr.style.height=Math.round(tw*1350/1080)+'px';const host=document.createElement('div');host.className='host';host.style.transform='scale('+sc+')';host.innerHTML=makeSlide(d,i);const n=document.createElement('div');n.className='n';n.textContent=i+1;const k=document.createElement('div');k.className='k';k.textContent=d.tipo;inr.appendChild(host);w.appendChild(inr);w.appendChild(n);w.appendChild(k);left.appendChild(w)})}
async function one(i){const d=S[i];if(!d)return null;const tmp=document.createElement('div');tmp.style.cssText='position:fixed;left:-9999px;top:-9999px;width:1080px;height:1350px;overflow:hidden';tmp.innerHTML=makeSlide(d,i);document.body.appendChild(tmp);await wait(120);const c=await html2canvas(tmp.firstChild,{width:1080,height:1350,scale:1,useCORS:true,backgroundColor:null,logging:false});document.body.removeChild(tmp);return c}
async function exportCurrent(){if(!S[cur])return;expO.classList.add('on');eBar.style.width='0';eText.textContent='Exportando JPG...';const c=await one(cur);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='RM_post_'+(cur+1)+'_1080x1350.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);expO.classList.remove('on')}
async function exportAll(){if(!S.length)return;expO.classList.add('on');eBar.style.width='0';eText.textContent='Preparando ZIP...';const zip=new JSZip();for(let i=0;i<S.length;i++){eBar.style.width=((i+1)/S.length*100)+'%';eText.textContent='Generando '+(i+1)+' de '+S.length+'...';const c=await one(i);const b=await new Promise(r=>c.toBlob(r,'image/png'));zip.file('RM_slide_'+(i+1)+'_1080x1350.png',b);await wait(80)}const content=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(content);a.download='RM_carrusel_'+S.length+'_slides.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);expO.classList.remove('on')}
function setMode(m){mode=m;document.getElementById('mPost').classList.toggle('on',m==='post');document.getElementById('mCarr').classList.toggle('on',m==='carrusel')}function toggleGuides(){guides=!guides}
window.addEventListener('resize',scale);window.addEventListener('load',()=>{scale();show(0)})
</script>
